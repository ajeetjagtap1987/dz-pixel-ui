worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Reverse-proxy /api/* to dashboard service via internal ALB or service discovery.
  # In ECS, set DASHBOARD_URL env var (e.g., http://pixel-alb-public-xxx.elb.amazonaws.com).
  # For Cloudflare-fronted deployments, /api/* requests typically come via api.pixel.example.com instead.

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /healthz {
      access_log off;
      return 200 '{"status":"ok","service":"ui-svc"}';
      add_header Content-Type application/json;
    }

    # Proxy API calls to dashboard service (configured via env)
    location /api/ {
      resolver 169.254.169.253 ipv6=off valid=10s;  # AWS VPC DNS
      set $dashboard_url "${DASHBOARD_URL}";
      proxy_pass $dashboard_url;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-style fallback to index.html (for React Router)
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
