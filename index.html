<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Tracker · Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .card {
    background: #1e293b; border-radius: 12px; padding: 3rem;
    max-width: 720px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #fbbf24; }
  .sub { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat { background: #0f172a; border-radius: 8px; padding: 1.25rem; text-align: center; }
  .stat .v { font-size: 1.75rem; font-weight: 700; color: #fbbf24; }
  .stat .l { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .health { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; padding: 0.75rem 1rem; background: #0f172a; border-radius: 6px; font-family: monospace; font-size: 0.875rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
  .dot.ok { background: #22c55e; }
  .dot.err { background: #ef4444; }
  .footer { margin-top: 2rem; font-size: 0.8rem; color: #64748b; }
  code { background: #0f172a; padding: 2px 6px; border-radius: 3px; font-size: 0.85em; }
</style>
</head>
<body>
  <div class="card">
    <h1>🎯 Pixel Tracker</h1>
    <p class="sub">Dashboard placeholder — replace this static page with your React build for production.</p>

    <div class="stats">
      <div class="stat"><div class="v" id="events">—</div><div class="l">Events Today</div></div>
      <div class="stat"><div class="v" id="users">—</div><div class="l">Unique Users</div></div>
      <div class="stat"><div class="v" id="campaigns">—</div><div class="l">Active Campaigns</div></div>
    </div>

    <div class="health"><span class="dot" id="api-dot"></span><span id="api-status">checking dashboard API…</span></div>
    <div class="health"><span class="dot" id="cf-dot"></span><span id="cf-status">checking Cloudflare proxy…</span></div>

    <p class="footer">
      Powered by <code>dz-pixel-ui</code> (Nginx) calling <code>dz-pixel-dashboard</code> at <code>/api/*</code>.
    </p>
  </div>

  <script>
    async function loadStats() {
      try {
        const r = await fetch('/api/stats');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();
        document.getElementById('events').textContent = data.events_today?.toLocaleString() ?? '—';
        document.getElementById('users').textContent = data.unique_users?.toLocaleString() ?? '—';
        document.getElementById('campaigns').textContent = data.active_campaigns ?? '—';
        document.getElementById('api-dot').className = 'dot ok';
        document.getElementById('api-status').textContent = 'dashboard API: OK';
      } catch (e) {
        document.getElementById('api-dot').className = 'dot err';
        document.getElementById('api-status').textContent = 'dashboard API: ' + e.message;
      }
    }
    async function checkCF() {
      try {
        const r = await fetch('/', { method: 'HEAD' });
        const cf = r.headers.get('cf-ray');
        if (cf) {
          document.getElementById('cf-dot').className = 'dot ok';
          document.getElementById('cf-status').textContent = 'Cloudflare proxy: OK (' + cf + ')';
        } else {
          document.getElementById('cf-dot').className = 'dot err';
          document.getElementById('cf-status').textContent = 'Cloudflare proxy: NOT in path (direct origin?)';
        }
      } catch (e) {
        document.getElementById('cf-dot').className = 'dot err';
        document.getElementById('cf-status').textContent = 'Cloudflare check failed';
      }
    }
    loadStats();
    checkCF();
    setInterval(loadStats, 10000);
  </script>
</body>
</html>
